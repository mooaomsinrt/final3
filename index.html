<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" id="theme-color" content="#121212">
  <meta name="description" content="หน้าแรกศูนย์รวมระบบร้านยาจำลอง สำหรับเจ้าหน้าที่ร้านยา">
  <title>ระบบร้านยาจำลอง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #121212;
      --card: #181818;
      --card-hover: #222222;
      --card-active: #282828;
      --border: #2a2a2a;
      --file-bg: #121212;
      --text: #ffffff;
      --muted: #b3b3b3;
      --accent: #1ed760;
      --accent-ink: #1ed760;
      --accent-soft: rgba(30, 215, 96, 0.14);
      --accent-border: rgba(30, 215, 96, 0.4);
      --warn: #f5b942;
      --warn-ink: #ffd782;
      --warn-soft: rgba(245, 185, 66, 0.12);
      --warn-border: rgba(245, 185, 66, 0.35);
      --shadow: none;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f6f5;
      --card: #ffffff;
      --card-hover: #f1fbf4;
      --card-active: #e4f6ea;
      --border: #d9e2dc;
      --file-bg: #eef2ef;
      --text: #121212;
      --muted: #525c56;
      --accent: #1ed760;
      --accent-ink: #0f7a38;
      --accent-soft: rgba(30, 215, 96, 0.16);
      --accent-border: rgba(15, 122, 56, 0.35);
      --warn: #c78300;
      --warn-ink: #7d5000;
      --warn-soft: rgba(245, 185, 66, 0.2);
      --warn-border: rgba(199, 131, 0, 0.35);
      --shadow: 0 2px 10px rgba(18, 18, 18, 0.05);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 4px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px var(--accent-soft);
      flex: 0 0 auto;
    }

    .brand-kicker {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent-ink);
      text-transform: uppercase;
    }

    .header-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      box-shadow: var(--shadow);
      transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
    }

    .theme-toggle:hover {
      background: var(--card-hover);
      border-color: var(--accent);
    }

    .theme-toggle:active {
      transform: scale(0.97);
    }

    .theme-toggle:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .sys-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.3;
    }

    .sys-pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex: 0 0 auto;
    }

    .sys-pill.is-online {
      color: var(--text);
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .sys-pill.is-online::before {
      background: var(--accent);
    }

    .sys-pill.is-warn {
      color: var(--warn-ink);
      border-color: var(--warn-border);
      background: var(--warn-soft);
    }

    .sys-pill.is-warn::before {
      background: var(--warn);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4.5vw, 2.25rem);
      font-weight: 700;
      line-height: 1.25;
      color: var(--text);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .notice {
      margin: 0;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      box-shadow: var(--shadow);
    }

    .menu-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      min-height: 84px;
      padding: 18px 20px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      box-shadow: var(--shadow);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
    }

    .menu-link:hover {
      background: var(--card-hover);
      border-color: var(--accent);
    }

    .menu-link:active {
      background: var(--card-active);
      transform: scale(0.99);
    }

    .menu-link:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .menu-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .menu-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .menu-index {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-ink);
      font-size: 0.875rem;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .menu-title {
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .menu-desc {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.45;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .menu-file {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.8rem;
      color: var(--muted);
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--file-bg);
      border: 1px solid var(--border);
    }

    .menu-arrow {
      display: inline-grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent-ink);
      font-size: 1.2rem;
      font-weight: 700;
      transition: background-color 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    .menu-link:hover .menu-arrow {
      background: var(--accent);
      color: #121212;
      transform: translateX(2px);
    }

    .footer {
      margin-top: auto;
      padding-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 560px) {
      .menu-link {
        min-height: 78px;
        padding: 16px;
      }

      .menu-file {
        display: none;
      }

      .menu-desc {
        white-space: normal;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .menu-link,
      .menu-arrow {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="header">
      <div class="brand-row">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-kicker">Mock Pharmacy Workshop</span>
        </div>
        <div class="header-controls">
          <span class="sys-pill" id="sys-status" role="status">กำลังตรวจการเชื่อมต่อ…</span>
          <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="สลับโหมดสีมืดและสว่าง">☀ โหมดสว่าง</button>
        </div>
      </div>
      <h1>ระบบร้านยาจำลอง</h1>
      <p class="subtitle">เลือกหน้าที่ต้องการใช้งานสำหรับเจ้าหน้าที่ร้านยา</p>
    </header>

    <p class="notice" role="note">ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง</p>

    <nav aria-label="เมนูหลักระบบร้านยาจำลอง">
      <ul class="menu-list" id="menu-list"></ul>
    </nav>

    <footer class="footer">
      <p id="env-note">ใช้งานผ่านเว็บ Vercel เพื่อเชื่อมต่อฐานข้อมูล Supabase</p>
    </footer>
  </main>

  <script>
    // เพิ่มหรือลบเมนูได้ด้วยการแก้หนึ่งบรรทัดในอาร์เรย์นี้
    const LINKS = [
      { href: 'pos.html',       title: 'หน้าขายยา',            desc: 'เลือกยา กรอกจำนวน บันทึกการจ่ายยา' },
      { href: 'admin.html',     title: 'จัดการระบบ (ผู้ดูแล)',  desc: 'บัญชียา คลังรายล็อต รายการจ่าย ต้องใช้รหัสผู้ดูแล' },
      { href: 'dashboard.html', title: 'Dashboard คลังยา',     desc: 'ภาพรวมคลัง ล็อตใกล้หมดอายุ ยาต่ำกว่าจุดสั่งซื้อ' },
      { href: 'status.html',    title: 'ตรวจสถานะระบบ',         desc: 'ตรวจว่าการเชื่อมต่อแต่ละส่วนทำงานปกติ' },
    ];

    const menuList = document.getElementById('menu-list');

    function renderMenu(items) {
      const frag = document.createDocumentFragment();
      items.forEach((item, index) => {
        const li = document.createElement('li');

        const link = document.createElement('a');
        link.className = 'menu-link';
        link.setAttribute('href', item.href);

        const copy = document.createElement('div');
        copy.className = 'menu-copy';

        const titleRow = document.createElement('div');
        titleRow.className = 'menu-title-row';

        const num = document.createElement('span');
        num.className = 'menu-index';
        num.setAttribute('aria-hidden', 'true');
        num.textContent = String(index + 1);

        const title = document.createElement('span');
        title.className = 'menu-title';
        title.textContent = item.title;

        const desc = document.createElement('span');
        desc.className = 'menu-desc';
        desc.textContent = item.desc;

        titleRow.append(num, title);
        copy.append(titleRow, desc);

        const action = document.createElement('div');
        action.className = 'menu-action';
        action.setAttribute('aria-hidden', 'true');

        const fileTag = document.createElement('span');
        fileTag.className = 'menu-file';
        fileTag.textContent = item.href;

        const arrow = document.createElement('span');
        arrow.className = 'menu-arrow';
        arrow.textContent = '→';

        action.append(fileTag, arrow);
        link.append(copy, action);
        li.append(link);
        frag.append(li);
      });
      menuList.replaceChildren(frag);
    }

    async function checkSystemBadge() {
      const pill = document.getElementById('sys-status');
      const note = document.getElementById('env-note');
      const host = location.hostname;

      if (location.protocol === 'file:') {
        pill.className = 'sys-pill is-warn';
        pill.textContent = 'เปิดจากไฟล์ในเครื่อง (ออฟไลน์)';
        note.textContent = 'เปิดผ่านลิงก์ vercel.app เพื่อให้ API และฐานข้อมูล Supabase ทำงานครบทุกหน้า';
        return;
      }

      if (host.endsWith('github.io')) {
        pill.className = 'sys-pill is-warn';
        pill.textContent = 'GitHub Pages ไม่มี API';
        note.textContent = 'กรุณาเปิดผ่านลิงก์ vercel.app เพื่อให้เชื่อม Supabase ได้';
        return;
      }

      try {
        const res = await fetch('/api/data', { cache: 'no-store' });
        const text = await res.text();
        let data = null;
        try { data = JSON.parse(text); } catch {}
        if (res.ok && data && data.drugs && data.stock && data.dispense_log) {
          const asOf = (data.drugs.meta && data.drugs.meta.as_of) || '-';
          pill.className = 'sys-pill is-online';
          pill.textContent = 'เชื่อมต่อ Supabase แล้ว · ณ ' + asOf;
          note.textContent = 'พร้อมใช้งาน · ยา ' + data.drugs.items.length + ' รายการ · คลัง ' + data.stock.items.length + ' ล็อต';
        } else {
          pill.className = 'sys-pill is-warn';
          pill.textContent = 'ยังไม่ได้เชื่อมฐานข้อมูล';
          note.textContent = 'กดปุ่ม "ตรวจสถานะระบบ" เพื่อดูสาเหตุและวิธีแก้ไข';
        }
      } catch {
        pill.className = 'sys-pill is-warn';
        pill.textContent = 'ตรวจสอบการเชื่อมต่อไม่ได้';
        note.textContent = 'กดปุ่ม "ตรวจสถานะระบบ" เพื่อดูรายละเอียด';
      }
    }

    const THEME_KEY = 'pharmacy_home_theme';
    const themeToggle = document.getElementById('theme-toggle');
    const themeColorMeta = document.getElementById('theme-color');

    function applyTheme(mode) {
      const isLight = mode === 'light';
      document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
      themeToggle.setAttribute('aria-pressed', String(isLight));
      themeToggle.textContent = isLight ? '🌙 โหมดมืด' : '☀ โหมดสว่าง';
      if (themeColorMeta) themeColorMeta.setAttribute('content', isLight ? '#f4f6f5' : '#121212');
    }

    function loadSavedTheme() {
      try {
        const saved = localStorage.getItem(THEME_KEY);
        return saved === 'light' ? 'light' : 'dark';
      } catch {
        return 'dark';
      }
    }

    themeToggle.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      applyTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch {}
    });

    applyTheme(loadSavedTheme());
    renderMenu(LINKS);
    checkSystemBadge();
  </script>
</body>
</html>
