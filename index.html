<!doctype html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" id="theme-color" content="#ffffff">
  <meta name="description" content="หน้าแรกศูนย์รวมระบบร้านยาจำลอง สำหรับเจ้าหน้าที่ร้านยา">
  <title>ระบบร้านยาจำลอง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --canvas: #ffffff;
      --surface-soft: #f1f4f7;
      --surface-hover: #e8edf2;
      --primary: #0064e0;
      --primary-deep: #0457cb;
      --primary-soft: rgba(0, 145, 255, 0.12);
      --ink-button: #000000;
      --on-ink-button: #ffffff;
      --ink-deep: #0a1317;
      --ink: #1c1e21;
      --charcoal: #444950;
      --slate: #4b4c4f;
      --steel: #5d6c7b;
      --stone: #8595a4;
      --hairline: #ced0d4;
      --hairline-soft: #dee3e9;
      --success: #31a24c;
      --success-soft: rgba(49, 162, 76, 0.12);
      --attention: #f2a918;
      --warning: #f7b928;
      --warning-soft: rgba(242, 169, 24, 0.14);
      --critical: #e41e3f;
      --promo-bg: #0a1317;
      --promo-text: #ffffff;
      --card-shadow: rgba(20, 22, 26, 0.06) 0px 1px 4px 0px;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #0a1317;
      --surface-soft: #141f26;
      --surface-hover: #1c2a33;
      --primary: #0091ff;
      --primary-deep: #0064e0;
      --primary-soft: rgba(0, 145, 255, 0.18);
      --ink-button: #ffffff;
      --on-ink-button: #0a1317;
      --ink-deep: #ffffff;
      --ink: #eef2f5;
      --charcoal: #c8d2dc;
      --slate: #aebac6;
      --steel: #95a5b5;
      --stone: #7b8c9d;
      --hairline: #2d3c47;
      --hairline-soft: #212e37;
      --success: #3cc15c;
      --success-soft: rgba(60, 193, 92, 0.18);
      --attention: #f7b928;
      --warning: #f7b928;
      --warning-soft: rgba(247, 185, 40, 0.18);
      --critical: #f0284a;
      --promo-bg: #0064e0;
      --promo-text: #ffffff;
      --card-shadow: none;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Noto Sans Thai", "Montserrat", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: -0.16px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Promo Notice Strip ---------- */
    .promo-banner {
      background: var(--promo-bg);
      color: var(--promo-text);
      padding: 10px 20px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.14px;
    }

    /* ---------- Top Navigation ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--canvas);
      border-bottom: 1px solid var(--hairline-soft);
    }

    .topbar-inner {
      max-width: 1040px;
      margin: 0 auto;
      min-height: 64px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink-deep);
      font-weight: 700;
      font-size: 17px;
      text-decoration: none;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background: var(--primary);
      display: inline-grid;
      place-items: center;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .sys-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 6px 14px;
      border-radius: 100px;
      background: var(--surface-soft);
      border: 1px solid var(--hairline-soft);
      color: var(--steel);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.14px;
    }

    .sys-pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--stone);
      flex: 0 0 auto;
    }

    .sys-pill.is-online {
      background: var(--success-soft);
      border-color: transparent;
      color: var(--success);
    }

    .sys-pill.is-online::before {
      background: var(--success);
    }

    .sys-pill.is-warn {
      background: var(--warning-soft);
      border-color: transparent;
      color: var(--ink-deep);
    }

    .sys-pill.is-warn::before {
      background: var(--attention);
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 8px 18px;
      border-radius: 100px;
      background: var(--canvas);
      border: 1px solid var(--hairline);
      color: var(--ink-deep);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.14px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.16s ease, border-color 0.16s ease;
    }

    .theme-toggle:active {
      background: var(--surface-soft);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ---------- Main Content ---------- */
    main {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: clamp(32px, 5vw, 56px) 24px max(48px, env(safe-area-inset-bottom));
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      padding: 4px 12px;
      border-radius: 100px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 5vw, 3rem);
      font-weight: 500;
      line-height: 1.17;
      color: var(--ink-deep);
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--slate);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.44;
    }

    /* ---------- Menu Cards ---------- */
    .menu-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
      min-height: 88px;
      padding: 20px 24px;
      border-radius: 24px;
      background: var(--canvas);
      border: 1px solid var(--hairline-soft);
      box-shadow: var(--card-shadow);
      color: var(--ink-deep);
      text-decoration: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
    }

    .menu-link:hover {
      background: var(--surface-soft);
      border-color: var(--hairline);
    }

    .menu-link:active {
      background: var(--surface-hover);
      transform: scale(0.99);
    }

    .menu-link:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    .menu-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .menu-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .menu-index {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background: var(--surface-soft);
      color: var(--ink-deep);
      font-size: 13px;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .menu-link:first-child .menu-index,
    .menu-list li:first-child .menu-index {
      background: var(--primary);
      color: #ffffff;
    }

    .menu-title {
      font-size: 20px;
      font-weight: 500;
      color: var(--ink-deep);
      line-height: 1.3;
    }

    .menu-desc {
      color: var(--steel);
      font-size: 16px;
      line-height: 1.5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-action {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .menu-file {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 13px;
      color: var(--steel);
      padding: 4px 10px;
      border-radius: 100px;
      background: var(--surface-soft);
      border: 1px solid var(--hairline-soft);
    }

    .menu-arrow {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      background: var(--ink-button);
      color: var(--on-ink-button);
      font-size: 18px;
      font-weight: 700;
      transition: background-color 0.16s ease, transform 0.16s ease;
    }

    .menu-list li:first-child .menu-arrow {
      background: var(--primary);
      color: #ffffff;
    }

    .menu-link:hover .menu-arrow {
      transform: translateX(2px);
    }

    /* ---------- Footer ---------- */
    .footer {
      margin-top: auto;
      padding: 20px 24px 28px;
      border-top: 1px solid var(--hairline-soft);
      color: var(--steel);
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .topbar-inner { padding: 10px 16px; }
      main { padding: 24px 16px 36px; gap: 20px; }
      .menu-link {
        min-height: 80px;
        padding: 16px 18px;
        border-radius: 18px;
      }
      .menu-file { display: none; }
      .menu-desc { white-space: normal; }
    }

    @media (prefers-reduced-motion: reduce) {
      .menu-link, .menu-arrow, .theme-toggle { transition: none; }
    }
  </style>
</head>
<body>
  <div class="promo-banner" role="note">ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง</div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./index.html">
        <span class="brand-mark" aria-hidden="true">Rx</span>
        <span>ระบบร้านยาจำลอง</span>
      </a>
      <div class="topbar-controls">
        <span class="sys-pill" id="sys-status" role="status">กำลังตรวจการเชื่อมต่อ…</span>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="สลับโหมดสีสว่างและมืด">🌙 โหมดมืด</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <span class="hero-kicker">Mock Pharmacy Workshop</span>
      <h1>ศูนย์รวมระบบร้านยาจำลอง</h1>
      <p class="subtitle">เลือกหน้าที่ต้องการใช้งานสำหรับเจ้าหน้าที่ร้านยา รองรับทั้งมือถือและแท็บเล็ต</p>
    </section>

    <nav aria-label="เมนูหลักระบบร้านยาจำลอง">
      <ul class="menu-list" id="menu-list"></ul>
    </nav>
  </main>

  <footer class="footer">
    <p id="env-note">ใช้งานผ่านเว็บ Vercel เพื่อเชื่อมต่อฐานข้อมูล Supabase</p>
  </footer>

  <script>
    // เพิ่มหรือลบเมนูได้ด้วยการแก้หนึ่งบรรทัดในอาร์เรย์นี้
    const LINKS = [
      { href: 'pos.html',       title: 'หน้าขายยา',            desc: 'เลือกยา กรอกจำนวน บันทึกการจ่ายยา' },
      { href: 'admin.html',     title: 'จัดการระบบ (ผู้ดูแล)',  desc: 'บัญชียา คลังรายล็อต รายการจ่าย ต้องใช้รหัสผู้ดูแล' },
      { href: 'dashboard.html', title: 'Dashboard คลังยา',     desc: 'ภาพรวมคลัง ล็อตใกล้หมดอายุ ยาต่ำกว่าจุดสั่งซื้อ' },
      { href: 'status.html',    title: 'ตรวจสถานะระบบ',         desc: 'ตรวจว่าการเชื่อมต่อแต่ละส่วนทำงานปกติ' },
    ];

    const menuList = document.getElementById('menu-list');

    function renderMenu(items) {
      const frag = document.createDocumentFragment();
      items.forEach((item, index) => {
        const li = document.createElement('li');

        const link = document.createElement('a');
        link.className = 'menu-link';
        link.setAttribute('href', item.href);

        const copy = document.createElement('div');
        copy.className = 'menu-copy';

        const titleRow = document.createElement('div');
        titleRow.className = 'menu-title-row';

        const num = document.createElement('span');
        num.className = 'menu-index';
        num.setAttribute('aria-hidden', 'true');
        num.textContent = String(index + 1);

        const title = document.createElement('span');
        title.className = 'menu-title';
        title.textContent = item.title;

        const desc = document.createElement('span');
        desc.className = 'menu-desc';
        desc.textContent = item.desc;

        titleRow.append(num, title);
        copy.append(titleRow, desc);

        const action = document.createElement('div');
        action.className = 'menu-action';
        action.setAttribute('aria-hidden', 'true');

        const fileTag = document.createElement('span');
        fileTag.className = 'menu-file';
        fileTag.textContent = item.href;

        const arrow = document.createElement('span');
        arrow.className = 'menu-arrow';
        arrow.textContent = '→';

        action.append(fileTag, arrow);
        link.append(copy, action);
        li.append(link);
        frag.append(li);
      });
      menuList.replaceChildren(frag);
    }

    async function checkSystemBadge() {
      const pill = document.getElementById('sys-status');
      const note = document.getElementById('env-note');
      const host = location.hostname;

      if (location.protocol === 'file:') {
        pill.className = 'sys-pill is-warn';
        pill.textContent = 'เปิดจากไฟล์ในเครื่อง (ออฟไลน์)';
        note.textContent = 'เปิดผ่านลิงก์ vercel.app เพื่อให้ API และฐานข้อมูล Supabase ทำงานครบทุกหน้า';
        return;
      }

      if (host.endsWith('github.io')) {
        pill.className = 'sys-pill is-warn';
        pill.textContent = 'GitHub Pages ไม่มี API';
        note.textContent = 'กรุณาเปิดผ่านลิงก์ vercel.app เพื่อให้เชื่อม Supabase ได้';
        return;
      }

      try {
        const res = await fetch('/api/data', { cache: 'no-store' });
        const text = await res.text();
        let data = null;
        try { data = JSON.parse(text); } catch {}
        if (res.ok && data && data.drugs && data.stock && data.dispense_log) {
          const asOf = (data.drugs.meta && data.drugs.meta.as_of) || '-';
          pill.className = 'sys-pill is-online';
          pill.textContent = 'เชื่อมต่อ Supabase · ณ ' + asOf;
          note.textContent = 'พร้อมใช้งาน · ยา ' + data.drugs.items.length + ' รายการ · คลัง ' + data.stock.items.length + ' ล็อต';
        } else {
          pill.className = 'sys-pill is-warn';
          pill.textContent = 'ยังไม่ได้เชื่อมฐานข้อมูล';
          note.textContent = 'กดปุ่ม "ตรวจสถานะระบบ" เพื่อดูสาเหตุและวิธีแก้ไข';
        }
      } catch {
        pill.className = 'sys-pill is-warn';
        pill.textContent = 'ตรวจสอบการเชื่อมต่อไม่ได้';
        note.textContent = 'กดปุ่ม "ตรวจสถานะระบบ" เพื่อดูรายละเอียด';
      }
    }

    const THEME_KEY = 'pharmacy_home_theme';
    const themeToggle = document.getElementById('theme-toggle');
    const themeColorMeta = document.getElementById('theme-color');

    function applyTheme(mode) {
      const isDark = mode === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      themeToggle.setAttribute('aria-pressed', String(isDark));
      themeToggle.textContent = isDark ? '☀ โหมดสว่าง' : '🌙 โหมดมืด';
      if (themeColorMeta) themeColorMeta.setAttribute('content', isDark ? '#0a1317' : '#ffffff');
    }

    function loadSavedTheme() {
      try {
        const saved = localStorage.getItem(THEME_KEY);
        return saved === 'dark' ? 'dark' : 'light';
      } catch {
        return 'light';
      }
    }

    themeToggle.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch {}
    });

    applyTheme(loadSavedTheme());
    renderMenu(LINKS);
    checkSystemBadge();
  </script>
</body>
</html>
